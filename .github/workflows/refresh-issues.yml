name: Refresh public issue list

on:
  schedule:
    # Once a day, after a typical publish hour. Run it by hand anytime from the Actions tab.
    - cron: "15 19 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/build-public-pages.mjs"
      - "index.html"
      - "archive/index.html"
      - "sitemap.xml"
      - ".github/workflows/refresh-issues.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-public-issues
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check the page builder
        run: node --test scripts/build-public-pages.test.mjs

      - name: Rebuild the issue list, archive, and sitemap
        run: node scripts/build-public-pages.mjs

      - name: Commit updated public pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html archive/index.html sitemap.xml
          if git diff --cached --quiet; then
            echo "Public issue list is already current."
            exit 0
          fi
          git commit -m "Refresh the public issue list and sitemap."
          git push origin HEAD
