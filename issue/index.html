<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tarmac Time</title>
    <meta name="description" content="Read an issue of Tarmac Time, a free newsletter for business aviation careers." />
    <meta name="theme-color" content="#0B0B0B" />
    <meta name="color-scheme" content="dark" />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="/favicon-512.png" type="image/png" sizes="512x512" />
    <link rel="apple-touch-icon" href="/favicon-512.png" />
    <meta property="og:site_name" content="Tarmac Time" />
    <meta property="og:title" content="Tarmac Time" />
    <meta property="og:image" content="https://tarmactime.com/og-thumbnail-1200x630.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Source+Sans+3:ital,wght@0,400;0,500;0,600;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="reader-top">
      <a href="/" aria-label="Tarmac Time home">
        <img src="/assets/logo-horizontal.png" width="894" height="250" alt="Tarmac Time, business aviation careers" />
      </a>
      <a class="back" href="/#issues">All issues</a>
    </header>

    <main class="reader" id="reader">
      <p class="reader-status" id="reader-status" role="status">Loading the issue…</p>
      <button type="button" class="reader-unlock" id="reader-unlock" hidden>Join free to read</button>
      <iframe
        class="reader-frame"
        id="reader-frame"
        title="Tarmac Time issue"
        sandbox="allow-same-origin allow-popups allow-popups-to-escape-sandbox"
        referrerpolicy="no-referrer"
        hidden
      ></iframe>
    </main>

    <section class="reader-cta">
      <a href="/#issues">Browse all past issues</a>
    </section>

    <footer class="wrap">
      <p>© 2026 Tarmac Time</p>
    </footer>
    <script src="/gate.js" defer></script>
  </body>
</html>
